name: Release Extension

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        # v6.0.7+ honors the packageManager-pinned pnpm (10.x); see node.js.yaml.
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          # expecting tags like v1.2.3
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from tag: $TAG_NAME" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump package.json version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Update CHANGELOG.md
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail

          # published_at looks like 2026-07-10T12:34:56Z; keep just the date.
          DATE="${RELEASE_DATE%%T*}"
          if [ -z "$DATE" ]; then
            DATE="$(date -u +%Y-%m-%d)"
          fi

          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md already has an entry for $VERSION; skipping"
            exit 0
          fi

          # Clean up GitHub's auto-generated release notes for the changelog:
          #   - normalise CRLFs
          #   - demote top-level "## " headings (e.g. "## What's Changed") to H3 so
          #     they nest under the version heading
          #   - strip the " by @user in <PR url>" attribution suffix from each line
          # Fall back to a placeholder if there are no notes.
          BODY="$(printf '%s' "$RELEASE_BODY" \
            | sed 's/\r$//' \
            | sed 's/^## /### /' \
            | sed -E 's| by @[^ ]+ in https://[^ ]+$||')"
          if [ -z "${BODY//[[:space:]]/}" ]; then
            BODY="- No release notes provided."
          fi

          printf '## [%s] - %s\n\n%s\n' "$VERSION" "$DATE" "$BODY" > /tmp/new_entry.md

          # Insert the new entry directly after the "## [Unreleased]" header.
          awk '
            /^## \[Unreleased\]/ && !inserted {
              print
              print ""
              while ((getline line < "/tmp/new_entry.md") > 0) print line
              inserted = 1
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          echo "Updated CHANGELOG.md with $VERSION"

      - name: Commit version bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Explicitly set the remote URL with the app token
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git add package.json pnpm-lock.yaml CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish Extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        run: vsce publish

      - name: Send release notification to Discord
        if: success()
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO_FULL_NAME: ${{ github.repository }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          REPO_NAME=$(echo $REPO_FULL_NAME | cut -d'/' -f2)
          MESSAGE=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg name "$RELEASE_NAME" \
            --arg url "$RELEASE_URL" \
            --arg icon "🚀" \
            '{content: "\($icon) \($repo) > [\($tag): \($name)](\($url)) has been released!"}')
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "$MESSAGE" \
            "$DISCORD_WEBHOOK"
